<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c39"><title>MBA Tournaments — Badminton Score Manager</title><style>body{margin:0;background:#eef2f8;color:#17243c;font:15px system-ui,sans-serif}header{background:#101c39;color:white;padding:18px 16px}h1{font-size:22px;margin:0}small{color:#a9bbd7}.wrap{max-width:1050px;margin:auto;padding:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button,.action{border:0;border-radius:8px;padding:11px 14px;background:#dce5f3;color:#142441;font-weight:700}.tabs button.active,.action{background:#155ad5;color:white}.panel{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #13243b12}h2{font-size:18px;margin:4px 0 12px}h3{font-size:16px}input{box-sizing:border-box;padding:9px;border:1px solid #b9c6da;border-radius:7px;min-width:0}input[type=number]{width:90px;font-size:19px;font-weight:800;text-align:center}.clearScore{background:#fff1f1;color:#9c2436;border:1px solid #f2caca;border-radius:7px;padding:5px 9px;font-size:12px}.match:has(.ok){border-color:#7ccfa3}.score strong{font-size:22px}input[type=text]{width:100%}.match{border:1px solid #d6deeb;border-radius:10px;padding:12px;margin:10px 0}.muted{color:#64748b;font-size:12px}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.team{padding:9px;border-radius:7px;background:#edf3ff}.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:9px;align-items:center}.score{display:flex;gap:8px;justify-content:center;margin:12px 0}.result{font-weight:700;color:#1258b5}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 7px;border-bottom:1px solid #e0e7f0;text-align:left}th{background:#102c58;color:white}tr:first-child td{font-weight:700}.status{font-size:12px;color:#556b8a}button{cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap}.warning{background:#fff1cf;padding:10px;border-radius:8px}.ok{color:#087c48}.bad{color:#b02035}@media(max-width:560px){.teams{grid-template-columns:1fr}.versus{gap:5px;font-size:12px}h1{font-size:19px}.wrap{padding:8px}}@media print{@page{size:A4 landscape;margin:9mm}header,.tabs,.tools,.noprint{display:none!important}body{background:white}.wrap{max-width:none}.panel{box-shadow:none;break-inside:avoid;padding:5px;margin:3px}.match{break-inside:avoid;padding:5px;margin:3px}input{border:0;padding:2px}h2{font-size:14px}.match{font-size:11px}table{font-size:10px}th,td{padding:4px}}</style></head><body><header><h1>🏸 MBA Tournaments | 4th MBA Badminton League</h1><small>14 November 2026 · 2 Courts · 18 Matches · Win 3 / Loss 0</small></header><main class="wrap"><nav class="tabs"><button data-tab="matches" class="active">മത്സരങ്ങൾ</button><button data-tab="standings">പോയിന്റ് ടേബിൾ</button><button data-tab="players">കളിക്കാർ</button><button data-tab="settings">എഡിറ്റ് / ബാക്കപ്പ്</button></nav><div id="content"></div></main><script>
const defaults=[{name:'Team Ameen Ashan',players:['Ameen Ashan','Askar','Janshar','Salam','Shuhaib','Marcelo']},{name:'Team Nithin',players:['Nithin','Ameen BH','Hakkeem','Irshad','Anil','Hari']},{name:'Team Faisal',players:['Faisal','Jaisal','Rashid','Sabir','Anoop','Nipun']},{name:'Thunder Smash',players:['Mubarak','Jafar','Shameer','Nabhan','Bava','Mohamed']}];
const schedule=[[0,1,2,3],[0,2,1,3],[0,3,1,2]]; // round of team pairings, per AB/CD/EF slot
const games=[];for(let round=0;round<3;round++)for(let pair=0;pair<3;pair++){let slot=round*3+pair+1;let p=schedule[round];games.push({id:'c1s'+slot,slot,court:1,pair,a:p[0],b:p[1]},{id:'c2s'+slot,slot,court:2,pair,a:p[2],b:p[3]})}
let state;try{state=JSON.parse(localStorage.getItem('mba-badminton-2026'))}catch{};if(!state||!state.teams||!state.scores)state={teams:structuredClone(defaults),scores:{}};let tab='matches';let courtFilter=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('mba-badminton-2026',JSON.stringify(state))}function pairName(team,p){return state.teams[team].players[p*2]+' & '+state.teams[team].players[p*2+1]}function outcome(g){let s=state.scores[g.id];if(!s||s.a===''||s.b===''||s.a==null||s.b==null)return null;let a=Number(s.a),b=Number(s.b);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>30||b>30||a===b||Math.max(a,b)!==30)return 'invalid';return a>b?g.a:g.b}function records(){let r=Array.from({length:4},()=>Array.from({length:3},()=>({p:0,w:0,l:0,pts:0,for:0,against:0})));for(let g of games){let w=outcome(g);if(w===null||w==='invalid')continue;let s=state.scores[g.id];for(let t of [g.a,g.b]){let x=r[t][g.pair];x.p++;x.w+=+(w===t);x.l+=+(w!==t);x.pts+=w===t?3:0;x.for+=Number(t===g.a?s.a:s.b);x.against+=Number(t===g.a?s.b:s.a)}}return r}function scoreInput(g,side){let val=state.scores[g.id]?.[side]??'';return `<input aria-label="${side==='a'?'First':'Second'} pair score" type="number" min="0" max="30" value="${esc(val)}" data-score="${g.id}" data-side="${side}">`}function matchCard(g){let w=outcome(g);return `<article class="match"><div class="muted">Slot ${g.slot} · Court ${g.court} · ${['AB','CD','EF'][g.pair]} League</div><div class="versus"><div><strong>${esc(pairName(g.a,g.pair))}</strong><div class="muted">${esc(state.teams[g.a].name)}</div></div><b>VS</b><div><strong>${esc(pairName(g.b,g.pair))}</strong><div class="muted">${esc(state.teams[g.b].name)}</div></div></div><div class="score">${scoreInput(g,'a')} <strong>—</strong> ${scoreInput(g,'b')}</div><div class="status">${w==='invalid'?'<span class="bad">സ്കോർ പരിശോധിക്കുക: വിജയിക്ക് 30, സമനില പാടില്ല</span>':w===null?'ഫലം നൽകിയിട്ടില്ല':`<span class="ok">🏆 Winner: ${esc(pairName(w,g.pair))} · 3 points / Loser: 0 points</span>`}</div><div class="tools noprint"><button class="clearScore" data-clear="${g.id}">Clear result</button></div></article>`}function renderMatches(){let done=games.filter(g=>typeof outcome(g)==='number').length;return `<section class="panel"><h2>മത്സരഫലങ്ങൾ · ${done}/18 പൂർത്തിയായി</h2><p class="muted">ഓരോ മത്സരത്തിലും രണ്ട് ജോഡികളുടെയും സ്കോർ നൽകുക; സ്കോർ മാറ്റിയാൽ എല്ലാ പോയിന്റ് ടേബിളുകളും ഉടൻ അപ്ഡേറ്റ് ആകും. വിജയിക്ക് 3, പരാജിതന് 0. പഴയ ഫലം തിരുത്താനും Clear result ഉപയോഗിക്കാം.</p><div class="tools noprint"><button class="action" id="print">A4 Print / PDF</button><button class="action" id="export">Backup JSON</button><button class="action" id="filterAll">All courts</button><button class="action" id="filter1">Court 1</button><button class="action" id="filter2">Court 2</button></div></section>${[1,2].filter(c=>!courtFilter||courtFilter===c).map(c=>`<section class="panel"><h2>Court ${c}</h2>${games.filter(g=>g.court===c).map(matchCard).join('')}</section>`).join('')}`}
function tableRows(entries){return entries.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.name)}</td><td>${e.p}</td><td>${e.w}</td><td>${e.l}</td><td><b>${e.pts}</b></td></tr>`).join('')}function makeTable(entries){return `<div class="scroll"><table><thead><tr><th>#</th><th>Team / Pair</th><th>P</th><th>W</th><th>L</th><th>PTS</th></tr></thead><tbody>${tableRows(entries)}</tbody></table></div>`}function sortR(a){return a.sort((x,y)=>y.pts-x.pts||y.w-x.w||x.name.localeCompare(y.name))}function renderStandings(){let r=records(),team=sortR(state.teams.map((t,i)=>({name:t.name,p:r[i].reduce((s,x)=>s+x.p,0),w:r[i].reduce((s,x)=>s+x.w,0),l:r[i].reduce((s,x)=>s+x.l,0),pts:r[i].reduce((s,x)=>s+x.pts,0)})));let done=games.filter(g=>typeof outcome(g)==='number').length;let lead=team.filter(x=>x.pts===team[0].pts);let champion=done===18?(lead.length===1?`🏆 Champion: ${esc(lead[0].name)} — ${lead[0].pts} points`:`🏆 Joint leaders: ${lead.map(x=>esc(x.name)).join(" / ")} (${lead[0].pts} pts); tie-break needed`):`⏳ ${18-done} matches remaining — provisional standings`;return `<section class="panel"><h2>${champion}</h2><h2>Overall Team Standings</h2>${makeTable(team)}<p class="muted">${done} / 18 matches completed. സമനിലയിൽ അന്തിമ റാങ്ക് തീരുമാനിക്കാൻ പ്രത്യേക ടൈബ്രേക്കർ നിയമം ആവശ്യമാണ്.</p></section>${[0,1,2].map(p=>`<section class="panel"><h2>${['AB','CD','EF'][p]} League</h2>${makeTable(sortR(state.teams.map((t,i)=>({name:pairName(i,p),...r[i][p]}))))}</section>`).join('')}`}function renderPlayers(){let r=records();return `<section class="panel"><h2>ഓരോ കളിക്കാരുടെയും ലീഗ് പോയിന്റ്</h2><p class="muted">ഡബിൾസ് മത്സരത്തിൽ ജോഡിയുടെ വിജയ പോയിന്റ് ഇരുവർക്കും ഒരുപോലെ കാണിക്കുന്നു. ഇവ കൂട്ടിയാൽ ടീം ടോട്ടൽ ഇരട്ടിയാകും; ടീം ടോട്ടലിന് ജോഡി പോയിന്റ് മാത്രമാണ് ഉപയോഗിക്കുന്നത്.</p><div class="scroll"><table><thead><tr><th>Team</th><th>Player</th><th>Pair</th><th>W</th><th>L</th><th>PTS</th></tr></thead><tbody>${state.teams.flatMap((t,i)=>t.players.map((name,j)=>`<tr><td>${esc(t.name)}</td><td>${esc(name)}</td><td>${['AB','CD','EF'][Math.floor(j/2)]}</td><td>${r[i][Math.floor(j/2)].w}</td><td>${r[i][Math.floor(j/2)].l}</td><td>${r[i][Math.floor(j/2)].pts}</td></tr>`)).join('')}</tbody></table></div></section>`}function renderSettings(){return `<section class="panel"><h2>ടീം പേരുകളും കളിക്കാരും തിരുത്തുക</h2>${state.teams.map((t,i)=>`<div class="match"><h3>Team ${i+1}</h3><label>Team name <input type="text" data-team="${i}" value="${esc(t.name)}"></label><div class="teams">${t.players.map((p,j)=>`<label>${'ABCDEF'[j]} <input type="text" data-player="${i}-${j}" value="${esc(p)}"></label>`).join('')}</div></div>`).join('')}<div class="tools"><button class="action" id="import">Import backup</button><input type="file" id="importFile" accept="application/json" hidden><button class="action" id="reset">Reset all results</button></div><p class="warning">ഫലങ്ങൾ ഈ ഫോണിലെ ബ്രൗസറിൽ മാത്രം സേവ് ചെയ്യും. ബ്രൗസർ ഡാറ്റ ക്ലിയർ ചെയ്താൽ നഷ്ടപ്പെടാം. ഇടയ്ക്കിടെ Backup JSON എടുക്കുക.</p></section>`}function render(){let content=tab==='matches'?renderMatches():tab==='standings'?renderStandings():tab==='players'?renderPlayers():renderSettings();$('content').innerHTML=content;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('print')?.addEventListener('click',()=>window.print());for(let n of [0,1,2])$('filter'+(n||'All'))?.addEventListener('click',()=>{courtFilter=n;render()});document.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{if(confirm('ഈ മത്സരത്തിന്റെ സ്കോർ മായ്ക്കണോ?')){delete state.scores[b.dataset.clear];save();render()}}));$('export')?.addEventListener('click',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mba-badminton-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});$('reset')?.addEventListener('click',()=>{if(confirm('എല്ലാ മത്സരഫലങ്ങളും മായ്ക്കണോ?')){state.scores={};save();render()}});$('import')?.addEventListener('click',()=>$('importFile').click());$('importFile')?.addEventListener('change',async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.teams)||x.teams.length!==4||!x.scores)throw Error('Invalid backup');state=x;save();render()}catch(e){alert('Backup തുറക്കാനായില്ല: '+e.message)}})}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.addEventListener('change',e=>{let t=e.target;if(t.dataset.score){let s=state.scores[t.dataset.score]??={a:'',b:''};s[t.dataset.side]=t.value;save();render()}else if(t.dataset.team!==undefined){state.teams[+t.dataset.team].name=t.value;save();render()}else if(t.dataset.player){let [i,j]=t.dataset.player.split('-').map(Number);state.teams[i].players[j]=t.value;save();render()}});render();
</script></body></html>
